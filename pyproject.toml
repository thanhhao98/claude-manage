[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-manage"
dynamic = ["version"]
description = "Capture, show, resume and relaunch Claude Code sessions, grouped by iTerm2 window"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thanhhao" }]
requires-python = ">=3.11"
dependencies = ["typer>=0.16"]
keywords = ["claude", "claude-code", "iterm2", "sessions", "cli"]
classifiers = [
  "Environment :: Console",
  "Environment :: MacOS X",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/thanhhao98/claude-manage"
Issues = "https://github.com/thanhhao98/claude-manage/issues"

[project.scripts]
claude-manage = "claude_manage.cli:main"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.dynamic]
version = { attr = "claude_manage.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_manage = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "RET", "PL", "TID"]
ignore = [
  "PLR0911", # too many returns
  "PLR0912", # too many branches
  "PLR0913", # too many arguments
  "PLR0915", # too many statements
  "PLR0917", # too many positional arguments (Typer commands)
  "PLR2004", # magic values
  "RUF001",  # ambiguous unicode in strings: the UI uses ● ◐ ○ ✓ ✗ …
  "RUF003",  # ditto in comments
  "PLC0415", # imports inside functions
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: drives a real iTerm2 window (opt-in: CM_LIVE=1, macOS only)"]
